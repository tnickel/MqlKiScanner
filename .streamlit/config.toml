# High-end Fintech Dark Marble Theme
[theme]
base = "dark"
primaryColor = "#00D2D3"
backgroundColor = "#0A111E"
secondaryBackgroundColor = "#142135"
textColor = "#F1F5F9"
linkColor = "#38BDF8"
borderColor = "#273E5B"
codeBackgroundColor = "#0F1A2A"
codeTextColor = "#CBD5E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "8px"
font = "sans-serif"
baseFontSize = 15
headingFontSizes = ["36px", "27px", "21px", "18px", "16px", "14px"]
headingFontWeights = [750, 700, 650, 600, 600, 600]
greenColor = "#10B981"
redColor = "#F43F5E"
yellowColor = "#F59E0B"
orangeColor = "#FB923C"
blueColor = "#38BDF8"
violetColor = "#A855F7"
grayColor = "#94A3B8"
dataframeBorderColor = "#273E5B"
dataframeHeaderBackgroundColor = "#182840"
chartCategoricalColors = ["#00D2D3", "#38BDF8", "#F59E0B", "#A855F7", "#F43F5E"]

[theme.sidebar]
backgroundColor = "#080E1A"
secondaryBackgroundColor = "#121E31"
textColor = "#F1F5F9"
primaryColor = "#00D2D3"
borderColor = "#273E5B"

[server]
headless = true
