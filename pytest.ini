[pytest]
testpaths = tests
python_files = test_*.py
# LLM-Regressionstests (tests/test_llm_prompt_regression.py) rufen das echte
# GLM-Modell auf und verbrauchen Tokens. Sie laufen NICHT im Standard-Build:
#   pytest                     -> alles ohne Marker llm (0 Token-Kosten)
#   pytest -m llm              -> nur die Prompt-Regressionstests
#   pytest -m "llm or not llm" -> alles (explizit inkl. Modellaufrufe)
# Ausfuehren, wann immer am Prompt-Mechanismus (Vorlagen, Payload, Builder,
# Ampel-Bindung) etwas geaendert wurde.
addopts = -m "not llm"
markers =
    llm: Prompt-Regressionstests mit echten GLM-Modellaufrufen (Token-Kosten; opt-in via `pytest -m llm`)
